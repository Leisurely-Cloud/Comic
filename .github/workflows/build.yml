name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Run WinUI tests
      run: dotnet test app/frontend-winui/src/Comic.WinUI.Tests/Comic.WinUI.Tests.csproj -c Release -r win-x64 --blame-hang-timeout 2m --blame-hang-dump-type none --filter "FullyQualifiedName!~DownloadTaskItemViewModelTests"

    - name: Publish framework-dependent C# app
      shell: pwsh
      run: ./scripts/build-and-package.ps1

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build installer
      run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: installer-output/ComicDownloader-*-Setup.exe

    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: installer-output/ComicDownloader-*-Setup.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
