name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: WinUI tests
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Install Windows App Runtime 1.8
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP "windowsappruntimeinstall-x64.exe"
        Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe" -OutFile $installer
        Start-Process -FilePath $installer -ArgumentList "--quiet" -Wait
    - name: Run WinUI tests
      # 预装 Windows App Runtime 后 testhost 不再挂起,运行全量测试。
      run: dotnet test app/frontend-winui/src/Comic.WinUI.Tests/Comic.WinUI.Tests.csproj -c Release -r win-x64 --blame-hang-timeout 2m --blame-hang-dump-type none

  package:
    name: Build installer
    runs-on: windows-latest
    # 打包与发布必须在测试通过后进行,否则 tag 推送会发出未经验证的安装包。
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    - name: Publish framework-dependent C# app
      shell: pwsh
      run: |
        # 打 tag 发布时用 tag 版本(如 v2.3.0 → 2.3.0)覆盖硬编码版本号。
        $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '' }
        ./scripts/build-and-package.ps1 -Version $version
    - name: Install Inno Setup
      run: choco install innosetup -y
    - name: Build installer
      shell: pwsh
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if ($env:GITHUB_REF_TYPE -eq 'tag') {
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & $iscc installer.iss "/DMyAppVersion=$version"
        } else {
          & $iscc installer.iss
        }
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: installer-output/ComicDownloader-*-Setup.exe
    - name: Prepare release notes
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        # 从 CHANGELOG.md 提取当前 tag 版本(如 v2.3.0)的段落作为 Release 说明。
        # 注意必须 -Encoding UTF8:CHANGELOG 是 UTF-8,默认 ANSI 读取会乱码。
        $version = $env:GITHUB_REF_NAME
        $content = Get-Content -Raw -Encoding UTF8 -Path CHANGELOG.md
        $escaped = [regex]::Escape($version)
        $pattern = "(?ms)^## $escaped[^\r\n]*\r?\n(.*?)(?=^## |\z)"
        $match = [regex]::Match($content, $pattern)
        $notes = if ($match.Success) { $match.Groups[1].Value.TrimEnd() } else { "Release $version" }
        [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "release-notes.md"),
            $notes,
            [System.Text.UTF8Encoding]::new($false))
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: installer-output/ComicDownloader-*-Setup.exe
        body_path: release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}