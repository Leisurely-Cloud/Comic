name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: WinUI tests
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pinned .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', 'Directory.Build.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Restore dependencies
      run: dotnet restore app/frontend-winui/src/Comic.WinUI.Tests/Comic.WinUI.Tests.csproj -r win-x64
    - name: Audit direct and transitive dependencies
      run: dotnet list app/frontend-winui/src/Comic.WinUI.Tests/Comic.WinUI.Tests.csproj package --vulnerable --include-transitive
    - name: Verify formatting
      run: dotnet format app/frontend-winui/src/Comic.WinUI.Tests/Comic.WinUI.Tests.csproj --verify-no-changes --no-restore --verbosity minimal
    - name: Build tests
      # 仅将编译器和 SDK 分析器警告视为错误；全局 -warnaserror 会把 MakePri 的本地化诊断强制升级，且无法由 WarningsNotAsErrors 排除。
      run: dotnet build app/frontend-winui/src/Comic.WinUI.Tests/Comic.WinUI.Tests.csproj -c Release -r win-x64 --no-restore -p:TreatWarningsAsErrors=true
    - name: Run WinUI tests
      # 测试宿主自带 Windows App SDK Runtime,无需修改 runner 的系统包注册。
      run: dotnet test app/frontend-winui/src/Comic.WinUI.Tests/Comic.WinUI.Tests.csproj -c Release -r win-x64 --no-build --no-restore --filter "TestCategory!=Live" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=tests.trx" --results-directory "${{ runner.temp }}/comic-test-results" --blame-hang-timeout 2m --blame-hang-dump-type none
    - name: Run JM live smoke test
      if: github.event_name == 'workflow_dispatch'
      env:
        COMIC_RUN_LIVE_TESTS: 1
      run: dotnet test app/frontend-winui/src/Comic.WinUI.Tests/Comic.WinUI.Tests.csproj -c Release -r win-x64 --no-build --no-restore --filter "TestCategory=Live" --logger "trx;LogFileName=live-tests.trx" --results-directory "${{ runner.temp }}/comic-test-results" --blame-hang-timeout 1m --blame-hang-dump-type none
    - name: Upload test and coverage reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: ${{ runner.temp }}/comic-test-results
        if-no-files-found: warn
        retention-days: 14

  package:
    name: Build installer
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch'
    # 打包与发布必须在测试通过后进行,否则 tag 推送会发出未经验证的安装包。
    needs: test
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup pinned .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Restore NuGet package cache
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj', 'Directory.Build.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - name: Publish framework-dependent C# app
      shell: pwsh
      run: |
        # 打 tag 发布时用 tag 版本(如 v2.3.0 → 2.3.0)覆盖硬编码版本号。
        $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { '' }
        ./scripts/build-and-package.ps1 -Version $version
    - name: Install Inno Setup
      run: choco install innosetup -y
    - name: Build installer
      shell: pwsh
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if ($env:GITHUB_REF_TYPE -eq 'tag') {
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          & $iscc installer.iss "/DMyAppVersion=$version"
        } else {
          & $iscc installer.iss
        }
    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: installer
        path: installer-output/ComicDownloader-*-Setup.exe
    - name: Prepare release notes
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        # 从 CHANGELOG.md 提取当前 tag 版本(如 v2.3.0)的段落作为 Release 说明。
        # 注意必须 -Encoding UTF8:CHANGELOG 是 UTF-8,默认 ANSI 读取会乱码。
        $version = $env:GITHUB_REF_NAME
        $content = Get-Content -Raw -Encoding UTF8 -Path CHANGELOG.md
        $escaped = [regex]::Escape($version)
        $pattern = "(?ms)^## $escaped[^\r\n]*\r?\n(.*?)(?=^## |\z)"
        $match = [regex]::Match($content, $pattern)
        $notes = if ($match.Success) { $match.Groups[1].Value.TrimEnd() } else { "Release $version" }
        [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "release-notes.md"),
            $notes,
            [System.Text.UTF8Encoding]::new($false))
    - name: Create Release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: installer-output/ComicDownloader-*-Setup.exe
        body_path: release-notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
